# Render Blueprint — Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy: push this repo to GitHub/GitLab, then in the Render
# dashboard choose "New +" -> "Blueprint" and point it at the repo.
# Render reads this file and provisions the service for you.
#
# PORT is NOT set here on purpose — Render injects it automatically
# for every web service (default 10000) and our app reads
# process.env.PORT, so there's nothing to configure.

services:
  - type: web
    name: node-red-automation
    runtime: docker
    plan: free
    region: singapore # change to whichever region is closest to you
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render's own restart/traffic gating uses this shallow check (just
    # confirms the HTTP server is up) so a transient DB hiccup doesn't
    # trigger a restart loop. GET /healthz/deep (added by
    # custom-nodes/system-health) also exists for manual/external
    # monitoring and additionally verifies PostgreSQL is reachable.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # REQUIRED. PostgreSQL is the only persistent storage this app
      # uses (no Redis, no local-filesystem fallback) — see
      # custom-nodes/db-core/ and scripts/db-bootstrap.js. Point this
      # at a Render PostgreSQL instance (or any reachable Postgres);
      # set it in the dashboard (Advanced -> Environment) since it's a
      # secret and shouldn't live in this file.
      - key: DB_POSTGRESDB_CONNECTION_URL
        sync: false

      # Optional DB tuning — safe RAM-conscious defaults are baked into
      # custom-nodes/db-core/pool.js if these are left unset.
      # - key: DB_POOL_MAX               # default 3
      # - key: DB_SSL_REJECT_UNAUTHORIZED # default false (managed PG certs)
      # - key: RETENTION_JOBS_DAYS       # default 14
      # - key: RETENTION_EXECUTIONS_DAYS # default 30
      # - key: RETENTION_AUDIT_DAYS      # default 90
      # - key: STALE_JOB_MINUTES         # default 15 (crash recovery threshold)

      # Generated automatically by Render on first deploy — keeps
      # node credentials stable across restarts (see settings.js).
      - key: NODE_RED_CREDENTIAL_SECRET
        generateValue: true

      # Set these two in the Render dashboard (Advanced -> Environment)
      # to password-protect the editor at /admin. Leave unset only for
      # quick local testing — an unauthenticated public editor can run
      # arbitrary JS/shell via function/exec nodes.
      - key: NODE_RED_USERNAME
        sync: false
      - key: NODE_RED_PASSWORD_HASH
        sync: false

      # No Google Client ID/Secret env var here on purpose — those are
      # entered once through the Credential Manager UI (a
      # google-oauth2-credential node in the editor), encrypted at rest
      # by Node-RED itself, never in this file or the dashboard. See
      # README "Credential Manager".

      # Loopback-only shared secret used by the Credential Manager's
      # internal token endpoint (see custom-nodes/credential-manager) so
      # Python exec-node scripts can fetch a short-lived Google access
      # token without a service-account file. Pinning it here just
      # avoids it changing every cold start; entrypoint.sh generates one
      # automatically if this is left unset.
      - key: NODE_RED_LOCAL_API_SECRET
        generateValue: true

      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: TZ
        value: Asia/Dhaka
      - key: NODE_RED_LOG_LEVEL
        value: info
