<script type="text/javascript">
    RED.nodes.registerType('google-oauth2-credentials', {
        category: 'config',
        defaults: {
            name: { value: '' },
            scopes: {
                value: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file',
                required: true,
            },
        },
        credentials: {
            clientId: { type: 'text' },
            clientSecret: { type: 'password' },
            accessToken: { type: 'password' },
            refreshToken: { type: 'password' },
            tokenExpiry: { type: 'text' },
        },
        label: function () {
            return this.name || 'Google OAuth2';
        },
        oneditprepare: function () {
            const id = this.id;
            const $status = $('<div>')
                .css({ marginTop: '6px', fontSize: '13px', fontWeight: '600' })
                .insertAfter('#node-config-input-scopes');

            function refreshStatus() {
                $status.text('Checking…').css('color', '#888');
                $.getJSON('credential-manager/google/' + id + '/test')
                    .done(function (r) {
                        $status.text('Connected \u2713 (scope: ' + (r.scope || 'unknown') + ')').css('color', '#2a7a2a');
                    })
                    .fail(function (xhr) {
                        const msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Not connected yet.';
                        $status.text(msg).css('color', '#a05a00');
                    });
            }
            refreshStatus();

            $('#cm-google-authorize').on('click', function (e) {
                e.preventDefault();
                RED.notify(
                    'If you just entered/changed the Client ID or Secret, click Deploy first — then Connect.',
                    { type: 'warning', timeout: 4000 }
                );
                window.open(
                    'credential-manager/google/' + id + '/authorize',
                    '_blank',
                    'width=520,height=650,noopener'
                );
            });
            $('#cm-google-test').on('click', function (e) {
                e.preventDefault();
                refreshStatus();
            });
            $('#cm-google-disconnect').on('click', function (e) {
                e.preventDefault();
                $.post('credential-manager/google/' + id + '/disconnect').done(function () {
                    RED.notify('Disconnected — tokens cleared. Client ID/Secret kept.', { type: 'success' });
                    refreshStatus();
                });
            });
            $('#cm-google-copyid').on('click', function (e) {
                e.preventDefault();
                navigator.clipboard.writeText(id);
                RED.notify('Credential ID copied: ' + id, { type: 'success', timeout: 2000 });
            });
        },
    });
</script>

<script type="text/html" data-template-name="google-oauth2-credentials">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="e.g. My Google Workspace" />
    </div>
    <div class="form-row">
        <label for="node-config-input-clientId"><i class="fa fa-id-card"></i> Client ID</label>
        <input type="text" id="node-config-input-clientId" autocomplete="off" style="width:70%" />
    </div>
    <div class="form-row">
        <label for="node-config-input-clientSecret"><i class="fa fa-lock"></i> Client Secret</label>
        <input type="password" id="node-config-input-clientSecret" autocomplete="new-password" style="width:70%" />
    </div>
    <div class="form-row">
        <label for="node-config-input-scopes"><i class="fa fa-list"></i> Scopes</label>
        <input type="text" id="node-config-input-scopes" style="width:70%" />
        <div style="font-size:12px;color:#888;margin-top:4px">space-separated Google OAuth scope URLs</div>
    </div>
    <div class="form-row">
        <label><i class="fa fa-link"></i> Redirect URL</label>
        <div style="font-size:12px;word-break:break-all;background:#f6f6f6;padding:6px;border-radius:4px">
            <code>https://&lt;your-render-domain&gt;/admin/credential-manager/google/oauth/callback</code>
        </div>
        <div style="font-size:12px;color:#888;margin-top:4px">
            Register this exact URL (with your real onrender.com or custom domain) as an Authorized redirect URI in
            Google Cloud Console → APIs &amp; Services → Credentials.
        </div>
    </div>
    <div class="form-row">
        <button type="button" id="cm-google-authorize" class="red-ui-button">Connect / Authorize with Google</button>
        <button type="button" id="cm-google-test" class="red-ui-button">Test Connection</button>
        <button type="button" id="cm-google-disconnect" class="red-ui-button">Disconnect</button>
    </div>
    <div class="form-row">
        <button type="button" id="cm-google-copyid" class="red-ui-button">Copy Credential ID</button>
        <div style="font-size:12px;color:#888;margin-top:4px">
            Needed by Python exec-node scripts (e.g. <code>scripts/gsheet_append.py</code>) that reference this
            credential by id.
        </div>
    </div>
</script>

<script type="text/html" data-help-name="google-oauth2-credentials">
    <p>
        A reusable Google OAuth2 credential — Node-RED's Credential Manager equivalent. Client ID/Secret and tokens
        are encrypted at rest and never shown back in plaintext once saved.
    </p>
    <ol>
        <li>Enter Client ID + Client Secret and the scopes you need, then click the main <b>Deploy</b> button.</li>
        <li>Come back into this dialog and click <b>Connect / Authorize with Google</b>, then complete consent.</li>
        <li>Reference this credential by name from a <b>Google API Request</b> node, or by its Credential ID from a
            Python <code>exec</code> node script.</li>
    </ol>
    <p>One credential can be selected by any number of nodes/flows — it is stored once, independent of any flow.</p>
</script>
