<script type="text/javascript">
    RED.nodes.registerType('google-api-request', {
        category: 'Google (OAuth)',
        color: '#C7E9FF',
        defaults: {
            name: { value: '' },
            credential: { type: 'google-oauth2-credentials', required: true },
            method: { value: 'GET' },
            url: { value: '' },
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'Google API Request',
        label: function () {
            return this.name || 'Google API Request';
        },
    });
</script>

<script type="text/html" data-template-name="google-api-request">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" />
    </div>
    <div class="form-row">
        <label for="node-input-credential"><i class="fa fa-key"></i> Credential</label>
        <input type="text" id="node-input-credential" />
    </div>
    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-arrow-right"></i> Method</label>
        <select id="node-input-method" style="width:150px">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-url"><i class="fa fa-globe"></i> URL</label>
        <input
            type="text"
            id="node-input-url"
            style="width:65%"
            placeholder="https://sheets.googleapis.com/v4/spreadsheets/{{payload.id}}"
        />
        <div style="font-size:12px;color:#888;margin-top:4px">
            Use <code>{{msg.property}}</code> to substitute values from the incoming message. Leave blank to take the
            URL from <code>msg.url</code> instead.
        </div>
    </div>
</script>

<script type="text/html" data-help-name="google-api-request">
    <p>
        Makes an authenticated HTTP request to any Google API using a shared <b>Google OAuth2</b> credential
        (selected above by name — the same credential any number of other nodes/flows can also select). The access
        token is fetched and auto-refreshed for you on every call; it never appears in the flow or in any message.
    </p>
    <p>
        <code>msg.payload</code> is sent as the JSON request body for non-GET methods, and set to the parsed
        response body on output. <code>msg.statusCode</code> holds the HTTP status code.
    </p>
</script>
